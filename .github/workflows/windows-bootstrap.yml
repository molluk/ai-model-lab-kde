name: Windows bootstrap (experimental)
on:
  push:
    branches:
      - feature/windows-10-11-support
      - dev
  pull_request:
    branches:
      - dev

jobs:
  windows-bootstrap:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: windows/requirements-build.txt
      - name: Install Windows GUI/build requirements
        run: python -m pip install -r windows/requirements-build.txt
      - name: Release preflight and Windows bootstrap tests
        run: |
          python release_preflight.py
          python -m unittest discover -s tests -p test_windows_bootstrap.py -v
          python -m unittest discover -s tests -p test_windows_process.py -v
          python -c "import gui; print('Qt GUI import OK')"
      - name: Package experimental Windows onedir executable
        shell: powershell
        run: ./windows/build.ps1 -SkipInstall
      - name: Verify executable is present
        shell: powershell
        run: |
          if (!(Test-Path "./dist/AI-Model-Lab/AI-Model-Lab.exe")) {
            throw "Missing .exe"
          }
