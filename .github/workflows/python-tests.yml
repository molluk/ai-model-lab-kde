name: Python tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Release preflight
        run: python3 release_preflight.py
      - name: Unit tests (headless, no CUDA required)
        run: python3 -m unittest discover -s tests -v

  qt-startup-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime dependencies on minimal runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install PySide6 for real headless GUI smoke
        run: python -m pip install PySide6
      - name: Launch actual Qt Window with legacy 88-char alias
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_gui_startup_smoke.py -v
